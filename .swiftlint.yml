#    regex: '[let,var] .+ = (\[.+\]\(\))'
#    capture_group: 1
#    message: "Use explicit type annotation when initializing empty arrays and dictionaries"
#    severity: warning

attributes:
  always_on_same_line:
    - "@IBSegueAction"
    - "@IBAction"
    - "@NSManaged"
    - "@objc"

force_cast: warning
force_try: warning

legacy_hashing: error

type_name:
  max_length:
    warning: 60
    error: 80

nesting:
    type_level:
        warning: 2

identifier_name:
  min_length: # only min_length
    error: 2 # only error
  excluded: # excluded via string array
    - sut
    - tag
    - log
    - id
    - URL
    - GlobalAPIKey
    - i
    - id
    - x
    - y
    - z
    - lhs
    - rhs
    - to

line_length:
  ignores_urls: true
  ignores_function_declarations: true
  ignores_comments: true

multiline_arguments:
  first_argument_location: next_line
  only_enforce_after_first_closure_on_first_line: true
  
private_over_fileprivate:
  validate_extensions: true

trailing_whitespace:
  ignores_empty_lines: false
  ignores_comments: true

vertical_whitespace:
  max_empty_lines: 2
  
child_config:
  animealTests/.swiftlint-tests.yml

