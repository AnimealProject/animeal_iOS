name: Generate IPA

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: 'Build flavor: qa (internal, QA menu, dev backend) or beta (release candidate, test backend)'
        type: choice
        options:
          - qa
          - beta
        default: qa
      environment:
        description: 'Backend override for qa flavor only (beta always uses test)'
        type: choice
        options:
          - default
          - dev
          - test
        default: default
  push:
    branches:
      - develop

jobs:
 SwiftLint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: GitHub Action for SwiftLint
      uses: norio-nomura/action-swiftlint@3.2.1
      with:
        args: --strict

 build:
    name: Build ${{ inputs.flavor || 'qa' }} flavor and upload to TestFlight
    runs-on: macos-26
    needs: SwiftLint

    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Resolve flavor and backend environment
        id: flavor
        run: |
          FLAVOR="${{ inputs.flavor || 'qa' }}"
          if [ "$FLAVOR" = "beta" ]; then
            # Beta builds go to real testers — never point them at dev,
            # and only build them from a release tag that matches the project version.
            if [ "${{ github.ref_type }}" != "tag" ]; then
              echo "::error::beta flavor must be built from a tag (vX.Y.Z), got ${{ github.ref_type }} '${{ github.ref_name }}'"
              exit 1
            fi
            MARKETING_VERSION=$(grep -oE 'MARKETING_VERSION = [0-9]+\.[0-9]+\.[0-9]+;' animeal.xcodeproj/project.pbxproj | sort -u | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
            if [ "${{ github.ref_name }}" != "v$MARKETING_VERSION" ]; then
              echo "::error::tag '${{ github.ref_name }}' does not match MARKETING_VERSION $MARKETING_VERSION"
              exit 1
            fi
            BACKEND_ENV="test"
            CONFIGURATION="Release"
          else
            BACKEND_ENV="${{ inputs.environment || 'default' }}"
            [ "$BACKEND_ENV" = "default" ] && BACKEND_ENV="dev"
            CONFIGURATION="QA"
          fi
          echo "flavor=$FLAVOR" >> "$GITHUB_OUTPUT"
          echo "backend_env=$BACKEND_ENV" >> "$GITHUB_OUTPUT"
          echo "configuration=$CONFIGURATION" >> "$GITHUB_OUTPUT"
          echo "Building flavor=$FLAVOR configuration=$CONFIGURATION backend=$BACKEND_ENV"
      - name: Install and run 'bundle install'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 2.6
          # runs 'bundle install' and caches installed gems automatically
          bundler-cache: true
      - name: Setup backend and build tools
        uses: ./.github/actions/setup-build
        with:
          environment: ${{ steps.flavor.outputs.backend_env }}
          dev-config-b64: ${{ secrets.AMPLIFY_CONFIG_DEV_B64 }}
          test-config-b64: ${{ secrets.AMPLIFY_CONFIG_TEST_B64 }}
          mapbox-token: ${{ secrets.MAPBOX_DOWNLOAD_TOKEN }}
      - name: Update Build Number
        run: bash Tools/update_build_number.sh
      - name: Set Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'
      - name: Build and export IPA
        uses: yukiarrr/ios-build-action@v1.12.0
        with:
          project-path: animeal.xcodeproj
          scheme: "animeal"
          export-method: "app-store"
          p12-base64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE }}
          mobileprovision-base64: ${{ secrets.APPLE_DISTRIBUTION_PROVISIONING_PROFILE }}
          certificate-password: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          code-signing-identity: "Apple Distribution: Sergey Teryokhyn (5HRLMFUWVY)"
          export-options: "ExportOptions.plist"
          team-id: "5HRLMFUWVY"
          configuration: ${{ steps.flavor.outputs.configuration }}
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: animeal-${{ steps.flavor.outputs.flavor }}-${{ steps.flavor.outputs.backend_env }}
          path: '**/*.ipa'
      - name: Upload to TestFlight
        run: |
          IPA=$(find . -name "*.ipa" | head -1)
          xcrun altool --upload-app -f "$IPA" -t ios \
            -u "$APP_STORE_CONNECT_USERNAME" \
            -p "$APP_STORE_CONNECT_PASSWORD"
        env:
          APP_STORE_CONNECT_USERNAME: ${{ secrets.APP_STORE_CONNECT_USERNAME }}
          APP_STORE_CONNECT_PASSWORD: ${{ secrets.APP_STORE_CONNECT_PASSWORD }}
