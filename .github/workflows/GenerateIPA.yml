name: Generate IPA

on:
  workflow_dispatch:
  push:
    branches:
      - develop

jobs:
 SwiftLint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: GitHub Action for SwiftLint
      uses: norio-nomura/action-swiftlint@3.2.1

 build:
    name: Build and Test default scheme using iPhone simulator
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install and run 'bundle install'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 2.6
          # runs 'bundle install' and caches installed gems automatically
          bundler-cache: true
      - name: Install npm
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install Amplify
        run: npm install -g @aws-amplify/cli
      - name: Setup Amplify
        id: setupAmplify
        run: bash ./update_amplify.sh -a $AWS_ACCESS_KEY_ID -s $AWS_SECRET_ACCESS_KEY -i $APP_ID -e $AMPLIFY_DEV_ENV -t $FACEBOOK_APP_ID -r $FACEBOOK_APP_SECRET
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          APP_ID: ${{ secrets.APP_ID }}
          AMPLIFY_DEV_ENV: ${{ secrets.AMPLIFY_DEV_ENV }}
          FACEBOOK_APP_ID: ${{ secrets.FACEBOOK_APP_ID }}
          FACEBOOK_APP_SECRET: ${{ secrets.FACEBOOK_APP_SECRET }}
      - name: Recover From Setup Amplfy  Error
        if: steps.setupAmplify.outcome != 'success'
        run: bash ./recover_from_error.sh
      
      - name: Sync Models with Backend Schema
        run: amplify codegen models
      
      - name: Setup .mapbox file with MAPBOX_DOWNLOAD_TOKEN
        run: echo $MAPBOX_DOWNLOAD_TOKEN >> ~/.mapbox
        env:
          MAPBOX_DOWNLOAD_TOKEN: ${{ secrets.MAPBOX_DOWNLOAD_TOKEN }}
      - name: Setup .netrc with MAPBOX_DOWNLOAD_TOKEN
        run: |
          echo 'machine api.mapbox.com' >> ~/.netrc
          echo 'login mapbox' >> ~/.netrc
          echo "password $MAPBOX_DOWNLOAD_TOKEN" >> ~/.netrc
          chmod 0600 ~/.netrc
        env:
          MAPBOX_DOWNLOAD_TOKEN: ${{ secrets.MAPBOX_DOWNLOAD_TOKEN }}
      - name: Install Swiftgen
        run: brew install swiftgen
      - name: Update Build Number
        run: bash Tools/update_build_number.sh
      - name: Generate Release Notes
        id: release_notes
        continue-on-error: true
        run: |
          if [ "${{ github.ref_name }}" == "main" ]; then
            # For main: get commits since last tag or last 20 commits
            LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [ -z "$LAST_TAG" ]; then
              COMMITS=$(git log --pretty=format:"- %s" --no-merges -20 || echo "- No commits found")
            else
              COMMITS=$(git log ${LAST_TAG}..HEAD --pretty=format:"- %s" --no-merges || echo "- No commits found")
            fi
          else
            # For develop: get commits from last PR only
            COMMITS=$(git log HEAD^..HEAD --pretty=format:"- %s" --no-merges 2>/dev/null || echo "- No commits found")
          fi
          echo "commits<<EOF" >> $GITHUB_OUTPUT
          echo "${COMMITS:-"- Build triggered manually"}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Set Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with: 
          xcode-version: '26.3'
      - name: Build and export IPA
        uses: yukiarrr/ios-build-action@v1.12.0
        with:
          project-path: animeal.xcodeproj
          scheme: "animeal"
          export-method: "development"
          p12-base64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE }}
          mobileprovision-base64: ${{ secrets.APPLE_DISTRIBUTION_PROVISIONING_PROFILE }}
          certificate-password: ${{ secrets.UNLOCK_CERTIFICATE }}
          code-signing-identity: "Apple Development: Pran Kishore (CM95PV92ZY)"
          export-options: "ExportOptions.plist"
          team-id: "2JSLPH439W"
          configuration: "Debug"
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: output  # Name of the artifact (optional)
          path: '**/*.ipa'  # Wildcard pattern to match output.ipa 
      - name: upload artifact to Firebase App Distribution
        uses: emertozd/Firebase-Distribution-Github-Action@v2
        with:
          appId: ${{secrets.FIREBASE_APP_ID}}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
          groups: qa_team
          file: output.ipa
