name: Generate IPA

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Backend: dev (safe for experiments) or test (real beta testers — no test data!)'
        type: choice
        options:
          - dev
          - test
        default: dev
      qa_menu:
        description: 'Include the QA menu (QA configuration, "Animeal QA"). Off = Release configuration, the beta build'
        type: boolean
        default: true
  push:
    branches:
      - develop

jobs:
 SwiftLint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: GitHub Action for SwiftLint
      uses: norio-nomura/action-swiftlint@3.2.1
      with:
        args: --strict

 build:
    name: Build ${{ inputs.qa_menu == false && 'Release' || 'QA' }} on ${{ inputs.environment || 'dev' }} and upload to TestFlight
    runs-on: macos-26
    needs: SwiftLint

    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Resolve configuration and backend environment
        id: flavor
        run: |
          BACKEND_ENV="${{ inputs.environment || 'dev' }}"
          if [ "${{ inputs.qa_menu }}" = "false" ]; then
            CONFIGURATION="Release"
            # Release builds are what beta testers get. The release flow builds
            # them from a tag vX.Y.Z; a manual run from a branch is allowed but flagged.
            MARKETING_VERSION=$(grep -oE 'MARKETING_VERSION = [0-9]+\.[0-9]+\.[0-9]+;' animeal.xcodeproj/project.pbxproj | sort -u | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
            if [ "${{ github.ref_type }}" = "tag" ]; then
              if [ "${{ github.ref_name }}" != "v$MARKETING_VERSION" ]; then
                echo "::error::tag '${{ github.ref_name }}' does not match MARKETING_VERSION $MARKETING_VERSION"
                exit 1
              fi
            else
              echo "::warning::Release build from ${{ github.ref_type }} '${{ github.ref_name }}' (version $MARKETING_VERSION) — not a release tag; do not hand this build to beta testers"
            fi
          else
            CONFIGURATION="QA"
          fi
          echo "backend_env=$BACKEND_ENV" >> "$GITHUB_OUTPUT"
          echo "configuration=$CONFIGURATION" >> "$GITHUB_OUTPUT"
          echo "Building configuration=$CONFIGURATION backend=$BACKEND_ENV"
      - name: Install and run 'bundle install'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 2.6
          # runs 'bundle install' and caches installed gems automatically
          bundler-cache: true
      - name: Setup backend and build tools
        uses: ./.github/actions/setup-build
        with:
          environment: ${{ steps.flavor.outputs.backend_env }}
          dev-config-b64: ${{ secrets.AMPLIFY_CONFIG_DEV_B64 }}
          test-config-b64: ${{ secrets.AMPLIFY_CONFIG_TEST_B64 }}
          mapbox-token: ${{ secrets.MAPBOX_DOWNLOAD_TOKEN }}
      - name: Update Build Number
        run: bash Tools/update_build_number.sh
      - name: Set Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'
      - name: Build and export IPA
        uses: yukiarrr/ios-build-action@v1.12.0
        with:
          project-path: animeal.xcodeproj
          scheme: "animeal"
          export-method: "app-store"
          p12-base64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE }}
          mobileprovision-base64: ${{ secrets.APPLE_DISTRIBUTION_PROVISIONING_PROFILE }}
          certificate-password: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          code-signing-identity: "Apple Distribution: Sergey Teryokhyn (5HRLMFUWVY)"
          export-options: "ExportOptions.plist"
          team-id: "5HRLMFUWVY"
          configuration: ${{ steps.flavor.outputs.configuration }}
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: animeal-${{ steps.flavor.outputs.configuration }}-${{ steps.flavor.outputs.backend_env }}
          path: '**/*.ipa'
      - name: Upload to TestFlight
        run: |
          IPA=$(find . -name "*.ipa" | head -1)
          xcrun altool --upload-app -f "$IPA" -t ios \
            -u "$APP_STORE_CONNECT_USERNAME" \
            -p "$APP_STORE_CONNECT_PASSWORD"
        env:
          APP_STORE_CONNECT_USERNAME: ${{ secrets.APP_STORE_CONNECT_USERNAME }}
          APP_STORE_CONNECT_PASSWORD: ${{ secrets.APP_STORE_CONNECT_PASSWORD }}
